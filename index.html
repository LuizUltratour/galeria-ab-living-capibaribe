<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria — Living Capibaribe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Montserrat SemiBold (600) — única fonte e único peso da galeria -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* LIVING CAPIBARIBE
         principal  #301711 (marrom profundo) · secundária #BE4119 (laranja) */
      --primary: #301711;
      --secondary: #BE4119;
      --bg: #301711;
      --ink: #FFFFFF;
      --ink-soft: rgba(255,255,255,0.72);
      --ink-mute: rgba(255,255,255,0.5);
      --glass: rgba(255,255,255,0.06);
      --glass-hi: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.14);
      --border-strong: rgba(255,255,255,0.34);
      --surface: #3E2018;
      --paper: #F6F1EC;                    /* papel das plantas (desenho em tinta escura) */
      --paper-ink: #301711;
      --font: 'Montserrat', system-ui, sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --radius: 18px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-weight: 600;
    }
    button { font-family: var(--font); font-weight: 600; }

    /* fundo da identidade visual + véu na cor principal para dar leitura ao conteúdo */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        linear-gradient(180deg, rgba(48,23,17,0.35) 0%, rgba(48,23,17,0.78) 100%),
        url('assets/brand/bg.webp') center / cover no-repeat;
      z-index: 0;
    }

    #g-root { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 2; }

    /* ── HEADER ── */
    #g-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 32px; flex-shrink: 0; }
    #g-brand { display: flex; align-items: center; gap: 22px; min-width: 0; }
    #g-logo { height: clamp(44px, 4.6vw, 64px); width: auto; display: block; flex-shrink: 0; }
    #g-heading {
      padding-left: 22px; border-left: 2px solid var(--secondary);
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink-soft); line-height: 1.5;
    }
    #g-heading b { display: block; font-weight: 600; font-size: 15px; letter-spacing: 0.14em; color: var(--ink); }

    /* botões em imagem (assets/brand/*-normal|hover.png) */
    .img-btn {
      width: 44px; height: 44px; flex-shrink: 0;
      border: none; padding: 0; cursor: pointer;
      background: center / contain no-repeat;
      border-radius: 12px;
      transition: transform 0.2s var(--ease);
    }
    .img-btn:hover { transform: scale(1.08); }
    .img-btn:active { transform: scale(0.95); }
    .img-btn:focus-visible { outline: 2px solid var(--secondary); outline-offset: 3px; }
    .img-btn:disabled { opacity: 0.25; cursor: default; }
    .ib-close { background-image: url('assets/brand/close-normal.png'); }
    .ib-close:hover { background-image: url('assets/brand/close-hover.png'); }
    .ib-prev  { background-image: url('assets/brand/voltar-normal.png'); }
    .ib-prev:hover:not(:disabled) { background-image: url('assets/brand/voltar-hover.png'); }
    .ib-next  { background-image: url('assets/brand/proximo-normal.png'); }
    .ib-next:hover:not(:disabled) { background-image: url('assets/brand/proximo-hover.png'); }

    /* ── FILTROS ── */
    #g-filters { flex-shrink: 0; padding-bottom: 6px; }
    #filter-main { display: flex; align-items: center; gap: 8px; padding: 6px 32px 10px; overflow-x: auto; scrollbar-width: none; }
    #filter-main::-webkit-scrollbar, #filter-sub-inner::-webkit-scrollbar { display: none; }

    .f-btn, .sf-btn {
      border: 1px solid var(--border-strong);
      background: var(--glass);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      cursor: pointer; color: var(--ink);
      white-space: nowrap; border-radius: 40px;
      transition: background 0.22s var(--ease), border-color 0.22s var(--ease), transform 0.15s var(--ease), box-shadow 0.22s var(--ease);
    }
    .f-btn  { padding: 10px 24px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
    .sf-btn { padding: 7px 18px; font-size: 11.5px; letter-spacing: 0.04em; border-color: var(--border); color: var(--ink-soft); }
    .f-btn:hover, .sf-btn:hover { background: var(--glass-hi); border-color: var(--secondary); color: var(--ink); }
    .f-btn.active, .sf-btn.active { background: var(--secondary); border-color: var(--secondary); color: #fff; box-shadow: 0 6px 20px rgba(190,65,25,0.45); }
    .f-btn:active, .sf-btn:active { transform: scale(0.97); }
    .f-btn:focus-visible, .sf-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    #filter-sub { overflow: hidden; max-height: 0; opacity: 0; transition: max-height 0.38s var(--ease), opacity 0.3s ease; }
    #filter-sub.open { max-height: 60px; opacity: 1; }
    #filter-sub-inner { display: flex; align-items: center; gap: 6px; padding: 2px 32px 8px; overflow-x: auto; scrollbar-width: none; }

    /* ── ÁREA ROLÁVEL ── */
    #g-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    #g-scroll::-webkit-scrollbar { width: 6px; }
    #g-scroll::-webkit-scrollbar-track { background: transparent; }
    #g-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    /* ── GRADE (masonry: cada card ocupa N linhas de 4px, calculado no JS) ── */
    #g-grid {
      --gap: 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 4px;
      column-gap: var(--gap);
      padding: 10px 32px 20px;
      align-items: start;
    }
    @media (max-width: 1280px) { #g-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 860px)  { #g-grid { grid-template-columns: repeat(2, 1fr); --gap: 10px; padding: 8px 16px 16px; } }
    @media (max-width: 480px)  { #g-grid { grid-template-columns: 1fr; } }

    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .g-card::before {
      content: ''; position: absolute; inset: 0; z-index: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.10) 40%, rgba(255,255,255,0.02) 80%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      transition: opacity 0.3s ease;
    }
    .g-card.loaded::before { opacity: 0; pointer-events: none; }

    .g-card {
      position: relative; overflow: hidden; cursor: pointer;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      animation: cardIn 0.55s var(--spring) both;
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), border-color 0.4s var(--ease);
    }
    .g-card:hover { transform: translateY(-5px); border-color: var(--secondary); box-shadow: 0 18px 42px rgba(0,0,0,0.5), 0 0 0 1px var(--secondary); }
    .g-card:focus-visible { outline: 2px solid var(--secondary); outline-offset: 3px; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(0.98); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }

    .g-card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      opacity: 0; position: relative; z-index: 1;
      transition: opacity 0.35s ease, transform 0.65s var(--ease);
    }
    .g-card.loaded img { opacity: 1; }
    .g-card:hover img { transform: scale(1.05); }

    .card-overlay {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 44px 18px 16px;
      background: linear-gradient(to top, rgba(28,13,9,0.92) 0%, rgba(28,13,9,0.55) 55%, transparent 100%);
      opacity: 0; transition: opacity 0.35s ease;
    }
    .g-card.loaded .card-overlay { opacity: 1; }
    .card-title { font-size: 13.5px; letter-spacing: 0.02em; line-height: 1.35; }
    .card-title::before { content: ''; display: block; width: 24px; height: 3px; border-radius: 2px; background: var(--secondary); margin-bottom: 8px; }
    .card-sub { font-size: 10.5px; letter-spacing: 0.06em; color: var(--ink-soft); margin-top: 4px; }

    .card-zoom {
      position: absolute; top: 14px; right: 14px; z-index: 2;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--secondary); color: #fff;
      opacity: 0; transform: scale(0.75);
      transition: opacity 0.25s var(--ease), transform 0.3s var(--spring);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .g-card.loaded:hover .card-zoom, .g-card:focus-visible .card-zoom { opacity: 1; transform: scale(1); }

    /* ── MODO PLANTAS ── */
    #g-grid.plantas-mode { grid-template-columns: 1fr; grid-auto-rows: auto; row-gap: 14px; padding: 10px 32px 20px; }
    .g-card.cob-card {
      cursor: default; display: flex; flex-direction: column;
      background: var(--paper); color: var(--paper-ink);
      border: 1px solid rgba(255,255,255,0.2);
      height: min(680px, calc(100vh - 230px)); min-height: 360px;
    }
    .g-card.cob-card::before { display: none; }
    .g-card.cob-card:hover { transform: none; border-color: rgba(255,255,255,0.2); box-shadow: 0 10px 28px rgba(0,0,0,0.35); }

    .cob-header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
      padding: 18px 24px 14px; flex-shrink: 0;
      border-bottom: 1px solid rgba(48,23,17,0.12);
    }
    .cob-badge {
      display: inline-block; padding: 4px 12px; margin-bottom: 6px;
      background: var(--secondary); color: #fff; border-radius: 40px;
      font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .cob-name { font-size: 18px; letter-spacing: 0.03em; }
    .cob-sub { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.55; margin-top: 4px; }
    .cob-note { font-size: 11.5px; opacity: 0.72; margin-top: 6px; min-height: 15px; }
    .cob-note:empty { display: none; }

    .floor-tabs {
      display: flex; gap: 4px; padding: 4px; max-width: 100%;
      border: 1px solid rgba(48,23,17,0.2); border-radius: 40px;
      background: rgba(48,23,17,0.05); overflow-x: auto; scrollbar-width: none;
    }
    .floor-tabs::-webkit-scrollbar { display: none; }
    .floor-tab {
      padding: 8px 18px; border: none; background: transparent; cursor: pointer;
      font-size: 11px; letter-spacing: 0.05em; color: var(--paper-ink);
      border-radius: 40px; white-space: nowrap;
      transition: background 0.22s var(--ease), color 0.22s var(--ease);
    }
    .floor-tab:hover { background: rgba(190,65,25,0.14); }
    .floor-tab.active { background: var(--secondary); color: #fff; }
    .floor-tab:focus-visible { outline: 2px solid var(--secondary); outline-offset: 2px; }

    .cob-body { flex: 1; position: relative; overflow: hidden; min-height: 0; }
    .floor-wrap {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.38s ease;
    }
    .floor-wrap.active { opacity: 1; pointer-events: auto; }
    .floor-skeleton {
      position: absolute; inset: 0; z-index: 0;
      background: linear-gradient(90deg, rgba(48,23,17,0.04) 0%, rgba(48,23,17,0.10) 40%, rgba(48,23,17,0.04) 80%);
      background-size: 800px 100%; animation: shimmer 1.4s infinite linear; transition: opacity 0.3s ease;
    }
    .cob-body.loaded .floor-skeleton { opacity: 0; pointer-events: none; }
    .floor-wrap img {
      width: 100%; height: 100%; object-fit: contain; cursor: zoom-in;
      opacity: 0; position: relative; z-index: 1;
      transition: opacity 0.35s ease, transform 0.3s ease;
    }
    .floor-wrap img.loaded { opacity: 1; }
    .floor-wrap img:hover { transform: scale(1.015); }
    .floor-lbl {
      position: absolute; left: 16px; bottom: 14px; z-index: 2;
      padding: 5px 13px; border-radius: 40px;
      background: var(--primary); color: #fff;
      font-size: 9.5px; letter-spacing: 0.09em; text-transform: uppercase;
    }
    .cob-footer { padding: 11px 24px; border-top: 1px solid rgba(48,23,17,0.12); flex-shrink: 0; }
    .cob-hint { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.6; }

    /* ── ESTADO VAZIO / AVISO ── */
    #g-empty { display: none; flex-direction: column; align-items: center; padding: 80px 24px; gap: 10px; }
    #g-empty.show { display: flex; }
    #g-empty p { font-size: 20px; opacity: 0.6; }
    #g-empty small { font-size: 11px; letter-spacing: 0.06em; opacity: 0.4; }
    #g-disclaimer { text-align: center; font-size: 10px; letter-spacing: 0.05em; color: var(--ink-mute); padding: 6px 16px 18px; }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0; z-index: 9000; display: flex; flex-direction: column;
      background: rgba(28,13,9,0.97);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #lightbox.open { opacity: 1; pointer-events: auto; }
    #lightbox > * { transform: translateY(8px) scale(0.99); transition: transform 0.35s var(--ease); }
    #lightbox.open > * { transform: none; }

    #lb-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 32px; flex-shrink: 0; }
    #lb-titles { flex: 1; min-width: 0; }
    #lb-title { font-size: 15px; letter-spacing: 0.02em; }
    #lb-title::before { content: ''; display: inline-block; width: 18px; height: 3px; border-radius: 2px; background: var(--secondary); vertical-align: middle; margin-right: 10px; }
    #lb-sub { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-soft); margin-top: 5px; }
    #lb-counter { font-size: 11px; letter-spacing: 0.08em; color: var(--ink-mute); }

    #lb-body { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 12px 84px; }
    #lb-img {
      max-width: 100%; max-height: 100%; object-fit: contain; display: block; border-radius: 6px;
      cursor: zoom-in; transform-origin: center center; will-change: transform; transition: opacity 0.18s ease;
    }
    #lb-img.plan { background: var(--paper); }          /* plantas têm fundo transparente e traço escuro */
    #lb-img.zoomed { cursor: grab; }
    #lb-img.dragging { cursor: grabbing; transition: none; }

    .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 48px; height: 48px; }
    .lb-nav:hover { transform: translateY(-50%) scale(1.08); }
    #lb-prev { left: 20px; } #lb-next { right: 20px; }

    #lb-foot { padding: 12px 32px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
    #lb-notice { font-size: 10.5px; letter-spacing: 0.06em; color: var(--ink-mute); padding: 6px 18px; border: 1px solid var(--border); border-radius: 40px; }
    #lb-notice:empty { display: none; }

    #lb-zoom-bar { display: flex; align-items: center; gap: 6px; }
    .lb-zoom-btn {
      width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-strong); background: var(--glass); color: #fff;
      border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; user-select: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .lb-zoom-btn:hover:not(:disabled) { background: var(--secondary); border-color: var(--secondary); }
    .lb-zoom-btn:disabled { opacity: 0.25; cursor: default; }
    #lb-zoom-level { font-size: 10.5px; letter-spacing: 0.06em; color: var(--ink-soft); min-width: 38px; text-align: center; }

    @keyframes lbOutLeft  { to   { opacity: 0; transform: translateX(-42px); } }
    @keyframes lbOutRight { to   { opacity: 0; transform: translateX(42px);  } }
    @keyframes lbInRight  { from { opacity: 0; transform: translateX(48px);  } to { opacity: 1; transform: translateX(0); } }
    @keyframes lbInLeft   { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes lbFadeIn   { from { opacity: 0; } to { opacity: 1; } }
    #lb-img.o-next { animation: lbOutLeft  0.16s var(--ease) forwards; }
    #lb-img.o-prev { animation: lbOutRight 0.16s var(--ease) forwards; }
    #lb-img.i-next { animation: lbInRight  0.40s var(--spring); }
    #lb-img.i-prev { animation: lbInLeft   0.40s var(--spring); }
    #lb-img.i-fade { animation: lbFadeIn   0.24s var(--ease); }

    @media (hover: none) { .card-zoom { opacity: 1; transform: scale(1); } .g-card:hover img { transform: none; } }

    @media (max-width: 900px) {
      #g-header { padding: 12px 18px; }
      #g-heading { display: none; }
      #filter-main { padding: 4px 18px 8px; }
      #filter-sub-inner { padding: 2px 18px 8px; }
      #g-grid.plantas-mode { padding: 8px 12px 16px; }
      .f-btn, .sf-btn, .floor-tab { display: inline-flex; align-items: center; min-height: 40px; }
      .img-btn { width: 46px; height: 46px; }
      #lb-head { padding: 14px 18px; }
      #lb-body { padding: 8px 64px; }
      #lb-prev { left: 10px; } #lb-next { right: 10px; }
      .lb-zoom-btn { width: 42px; height: 42px; }
      .floor-lbl { display: none; }
    }
    @media (max-width: 600px) {
      .f-btn { padding: 8px 16px; font-size: 11px; }
      .cob-header { flex-direction: column; align-items: flex-start; padding: 14px 16px 10px; }
      .cob-footer { padding: 9px 16px; }
      .g-card.cob-card { height: calc(100vh - 250px); min-height: 300px; }
      #lb-body { padding: 0; }
      #lb-prev, #lb-next { background-color: rgba(28,13,9,0.55); }
      #lb-foot { padding: 8px 14px 14px; }
      #lb-notice { font-size: 9.5px; padding: 4px 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
      .g-card { animation: none; filter: none; }
      .g-card:hover, .g-card:hover img { transform: none; }
      .g-card::before, .floor-skeleton { animation: none; }
      #lightbox > * { transform: none; }
    }
  </style>
</head>
<body>

<div id="g-root">

  <header id="g-header">
    <div id="g-brand">
      <img id="g-logo" src="assets/brand/logo.png" alt="Living Capibaribe">
      <div id="g-heading"><b>Galeria</b>Living Capibaribe</div>
    </div>
    <button id="btn-close" class="img-btn ib-close" title="Fechar galeria" aria-label="Fechar"></button>
  </header>

  <div id="g-filters">
    <div id="filter-main"></div>
    <div id="filter-sub"><div id="filter-sub-inner"></div></div>
  </div>

  <div id="g-scroll">
    <div id="g-grid"></div>
    <div id="g-empty">
      <p>Nenhuma imagem encontrada</p>
      <small>Selecione outra categoria</small>
    </div>
    <p id="g-disclaimer">Imagens meramente ilustrativas.</p>
  </div>

</div>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Visualizador de imagem">
  <div id="lb-head">
    <div id="lb-titles">
      <div id="lb-title"></div>
      <div id="lb-sub"></div>
    </div>
    <div id="lb-counter"></div>
    <button id="lb-close" class="img-btn ib-close" aria-label="Fechar"></button>
  </div>
  <div id="lb-body">
    <button id="lb-prev" class="lb-nav img-btn ib-prev" aria-label="Anterior"></button>
    <img id="lb-img" src="" alt="">
    <button id="lb-next" class="lb-nav img-btn ib-next" aria-label="Próximo"></button>
  </div>
  <div id="lb-foot">
    <div id="lb-zoom-bar">
      <button class="lb-zoom-btn" id="lb-zoom-out" aria-label="Diminuir zoom" title="Diminuir zoom">−</button>
      <span id="lb-zoom-level">100%</span>
      <button class="lb-zoom-btn" id="lb-zoom-in" aria-label="Aumentar zoom" title="Aumentar zoom">+</button>
    </div>
    <div id="lb-notice">Imagens meramente ilustrativas.</div>
  </div>
</div>

<script>
// ================================================================
// CONFIGURAÇÃO DA GALERIA
// Imagens: assets/<pasta>/<nome>.webp · miniaturas: assets/miniaturas/<pasta>/<nome>.webp
// (gerados por build_assets.mjs a partir de _originais/). `ar` = largura/altura,
// usado para montar a grade sem "pulo" de layout.
// ================================================================
const GALLERY_CONFIG = {
  projectName: 'LIVING CAPIBARIBE',

  categories: [
    { id: 'fachada', label: 'Fachada e Acessos' },
    {
      id: 'areas-comuns', label: 'Áreas Comuns',
      subs: [
        { id: 'ac-todas',    label: 'Todas' },
        { id: 'ac-lazer',    label: 'Lazer e Gourmet' },
        { id: 'ac-servicos', label: 'Bem-estar e Serviços' },
      ]
    },
    { id: 'apartamento', label: 'Apartamentos' },
    {
      id: 'plantas', label: 'Plantas',
      subs: [
        { id: 'pl-pavimentos',   label: 'Pavimentos' },
        { id: 'pl-apartamentos', label: 'Apartamentos' },
      ]
    },
  ],

  items: [

// ENGINE
// ================================================================
const st = {
  cat:    'all',
  sub:    null,
  lbItems: [],
  lbIdx:   -1,
};

const $ = id => document.getElementById(id);

const elFilterMain    = $('filter-main');
const elFilterSub     = $('filter-sub');
const elFilterSubIn   = $('filter-sub-inner');
const elGrid          = $('g-grid');
const elEmpty         = $('g-empty');
const elLightbox      = $('lightbox');
const elLbImg         = $('lb-img');
const elLbTitle       = $('lb-title');
const elLbSub         = $('lb-sub');
const elLbCounter     = $('lb-counter');
const elLbNotice      = $('lb-notice');
const elLbPrev        = $('lb-prev');
const elLbNext        = $('lb-next');

// ── modo: 'imagens' | 'plantas' | 'all' ──────────────────────────
const MODE = (() => {
  try {
    const m = new URLSearchParams(window.location.search).get('mode') || 'all';
    return ['all','imagens','plantas'].includes(m) ? m : 'all';
  } catch(_) { return 'all'; }
})();

// Categorias exibidas no filtro principal conforme modo
const DISPLAY_CATS = (() => {
  // No modo plantas as sub-categorias de 'plantas' viram o filtro principal.
  if (MODE === 'plantas') return getCat('plantas').subs.map(s => ({ id: s.id, label: s.label }));
  if (MODE === 'imagens') return GALLERY_CONFIG.categories.filter(c => c.id !== 'plantas');
  return GALLERY_CONFIG.categories;
})();

// ── helpers ──────────────────────────────────────────────────────
function getCat(id) { return GALLERY_CONFIG.categories.find(c => c.id === id); }
function getSubLabel(catId, subId) {
  const cat = getCat(catId);
  if (!cat || !cat.subs) return '';
  const s = cat.subs.find(s => s.id === subId);
  return s ? s.label : '';
}

// ── filters ──────────────────────────────────────────────────────
function renderMainFilters() {
  elFilterMain.innerHTML = '';
  DISPLAY_CATS.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'f-btn' + (cat.id === st.cat ? ' active' : '');
    b.textContent = cat.label;
    b.addEventListener('click', () => {
      if (cat.id === st.cat) return;
      st.cat = cat.id;
      // Se a categoria tem sub-filtros, pré-seleciona o primeiro
      st.sub = (cat.subs && cat.subs.length) ? cat.subs[0].id : null;
      renderMainFilters(); renderSubFilters(); renderGallery();
    });
    elFilterMain.appendChild(b);
  });
}

function renderSubFilters() {
  // No modo plantas o filtro principal já é a tipologia — sem sub-filtro
  if (MODE === 'plantas') { elFilterSub.classList.remove('open'); return; }
  const cat = getCat(st.cat);
  if (cat && cat.subs && cat.subs.length) {
    elFilterSubIn.innerHTML = '';
    const addSub = (id, label) => {
      const b = document.createElement('button');
      b.className = 'sf-btn' + (st.sub === id ? ' active' : '');
      b.textContent = label;
      b.addEventListener('click', () => {
        if (st.sub === id) return;
        st.sub = id;
        renderSubFilters(); renderGallery();
      });
      elFilterSubIn.appendChild(b);
    };
    cat.subs.forEach(s => addSub(s.id, s.label));
    elFilterSub.classList.add('open');
  } else {
    elFilterSub.classList.remove('open');
  }
}

// ── gallery ──────────────────────────────────────────────────────
function filteredItems() {
  return GALLERY_CONFIG.items.filter(item => {
    // Filtro de modo
    if (MODE === 'plantas' && item.category !== 'plantas') return false;
    if (MODE === 'imagens' && item.category === 'plantas') return false;

    // Filtro de categoria
    if (MODE === 'plantas') {
      if (item.subCategory !== st.cat) return false;
    } else {
      if (st.cat && item.category !== st.cat) return false;
      if (st.sub && st.sub !== 'ac-todas' && item.subCategory !== st.sub) return false;  // 'ac-todas' = sem filtro de sub
    }
    return true;
  });
}

function renderGallery() {
  const items = filteredItems();
  const existing = elGrid.querySelectorAll('.g-card');

  const doRender = () => {
    elGrid.innerHTML = '';
    const plantView = MODE === 'plantas' || st.cat === 'plantas';
    elGrid.classList.toggle('plantas-mode', plantView);
    elEmpty.classList.remove('show');
    st.lbItems = items.filter(i => i.type === 'image');
    if (!items.length) { elEmpty.classList.add('show'); return; }
    items.forEach((item, i) => {
      const card = item.type === 'cobertura-plan'
        ? buildCobCard(item)
        : buildImgCard(item);
      card.style.animationDelay = Math.min(i * 0.04, 0.5) + 's';
      elGrid.appendChild(card);
    });
    layoutMasonry();
  };

  if (existing.length) {
    existing.forEach(c => { c.style.animation = 'cardOut 0.18s ease forwards'; });
    setTimeout(doRender, 165);
  } else {
    doRender();
  }
}

// ── masonry: cada card ocupa N linhas de 4px conforme sua proporção ──
function layoutMasonry() {
  if (elGrid.classList.contains('plantas-mode')) return;
  const cs = getComputedStyle(elGrid);
  const gap = parseFloat(cs.columnGap) || 12;
  const ROW = 4;
  elGrid.querySelectorAll('.g-card[data-ar]').forEach(card => {
    const w = card.getBoundingClientRect().width;
    if (!w) return;
    card.style.gridRowEnd = 'span ' + Math.ceil((w / parseFloat(card.dataset.ar) + gap) / ROW);
  });
}
if ('ResizeObserver' in window) new ResizeObserver(layoutMasonry).observe(elGrid);
window.addEventListener('resize', layoutMasonry);

// inject cardOut keyframe once
(function () {
  const s = document.createElement('style');
  s.textContent = '@keyframes cardOut{to{opacity:0;transform:scale(0.97)}}';
  document.head.appendChild(s);
}());

function buildImgCard(item) {
  const card = document.createElement('div');
  card.className = 'g-card';
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', 'Ampliar: ' + item.title + (item.subtitle ? ' — ' + item.subtitle : ''));
  if (item.ar) { card.dataset.ar = item.ar; card.style.aspectRatio = item.ar; } else { card.style.aspectRatio = '4/3'; }

  const img = document.createElement('img');
  img.src = item.thumb || item.src;
  img.alt = item.title;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.addEventListener('load',  () => card.classList.add('loaded'));
  img.addEventListener('error', () => card.classList.add('loaded'));
  if (img.complete) card.classList.add('loaded');

  const ov = document.createElement('div');
  ov.className = 'card-overlay';
  ov.innerHTML = `<div class="card-title">${item.title}</div>` +
    (item.subtitle ? `<div class="card-sub">${item.subtitle}</div>` :
     item.subCategory ? `<div class="card-sub">${getSubLabel(item.category, item.subCategory)}</div>` : '');

  const zoom = document.createElement('div');
  zoom.className = 'card-zoom';
  zoom.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="15" height="15"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`;

  card.appendChild(img);
  card.appendChild(ov);
  card.appendChild(zoom);
  card.addEventListener('click', () => openLb(item));
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(item); } });
  return card;
}

function buildCobCard(item) {
  const card = document.createElement('div');
  card.className = 'g-card cob-card';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'cob-header';

  const tg = document.createElement('div');
  tg.innerHTML = `<div class="cob-badge">${item.badge || 'Planta'}</div>
    <div class="cob-name">${item.title}</div>
    ${item.area ? `<div class="cob-area">${item.area}</div>` : ''}
    ${item.subtitle ? `<div class="cob-sub">${item.subtitle}</div>` : ''}
    <div class="cob-note"></div>`;

  const tabs = document.createElement('div');
  tabs.className = 'floor-tabs';

  hdr.appendChild(tg);
  hdr.appendChild(tabs);

  // Body
  const body = document.createElement('div');
  body.className = 'cob-body';

  // skeleton overlay for cob body
  const skel = document.createElement('div');
  skel.className = 'floor-skeleton';
  body.appendChild(skel);

  let loadedCount = 0;
  item.floors.forEach((floor, fi) => {
    // tab
    const tab = document.createElement('button');
    tab.className = 'floor-tab' + (fi === 0 ? ' active' : '');
    tab.textContent = floor.label;
    if (floor.note) tab.title = floor.note;
    if (fi === 0 && floor.note) tg.querySelector('.cob-note').textContent = floor.note;
    tab.addEventListener('click', () => {
      tabs.querySelectorAll('.floor-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      body.querySelectorAll('.floor-wrap').forEach((w, wi) => w.classList.toggle('active', wi === fi));
      tg.querySelector('.cob-note').textContent = floor.note || '';
    });
    tabs.appendChild(tab);

    // image wrap
    const wrap = document.createElement('div');
    wrap.className = 'floor-wrap' + (fi === 0 ? ' active' : '');

    const img = document.createElement('img');
    img.src = floor.thumb || floor.src;
    img.alt = floor.label;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.addEventListener('click', () => openLbFloor(item, fi));
    const onImgLoad = () => {
      img.classList.add('loaded');
      loadedCount++;
      if (loadedCount >= item.floors.length) body.classList.add('loaded');
    };
    img.addEventListener('load', onImgLoad);
    img.addEventListener('error', onImgLoad);
    if (img.complete) onImgLoad();

    const lbl = document.createElement('div');
    lbl.className = 'floor-lbl';
    lbl.textContent = floor.label;

    wrap.appendChild(img);
    wrap.appendChild(lbl);
    body.appendChild(wrap);
  });

  // Planta única (pavimento tipo, lazer): sem o que alternar, sem abas.
  if (item.floors.length < 2) tabs.style.display = 'none';

  // Footer — só a dica de uso; a alternância é pelas abas do cabeçalho.
  const foot = document.createElement('div');
  foot.className = 'cob-footer';

  const hint = document.createElement('span');
  hint.className = 'cob-hint';
  hint.textContent = item.hint || (item.floors.length + ' pavimentos — alterne nas abas · toque para ampliar');
  foot.appendChild(hint);

  card.appendChild(hdr);
  card.appendChild(body);
  card.appendChild(foot);
  return card;
}

// ── lightbox ─────────────────────────────────────────────────────
function showLb() {
  elLightbox.classList.add('open');
  document.addEventListener('keydown', onLbKey);
}

function openLb(item) {
  elLbImg.classList.remove('plan');
  st.lbIdx = st.lbItems.findIndex(i => i.id === item.id);
  elLbImg.style.display = '';
  elLbPrev.style.display = '';
  elLbNext.style.display = '';
  updateLb();
  showLb();
}

function openLbFloor(item, fi) {
  elLbImg.style.display = '';
  elLbPrev.style.display = 'none';
  elLbNext.style.display = 'none';
  elLbImg.classList.add('plan');
  elLbImg.src = item.floors[fi].src;
  elLbTitle.textContent = item.title;
  elLbSub.textContent = item.floors[fi].label + (item.floors[fi].note ? ' · ' + item.floors[fi].note : '');
  elLbCounter.textContent = '';
  elLbNotice.textContent = item.notice || 'As plantas pertencem à mesma unidade';
  showLb();
}

function closeLb() {
  elLightbox.classList.remove('open');
  document.removeEventListener('keydown', onLbKey);
  if (window._lbResetZoom) window._lbResetZoom();
  setTimeout(() => {
    elLbImg.style.display = '';
    elLbPrev.style.display = '';
    elLbNext.style.display = '';
  }, 300);
}

function updateLb(dir) {
  const item = st.lbItems[st.lbIdx];
  if (!item) return;

  // Textos/contador atualizam de imediato
  elLbTitle.textContent = item.title;
  elLbSub.textContent = item.subtitle || (item.subCategory ? getSubLabel(item.category, item.subCategory) : '');
  elLbCounter.textContent = (st.lbIdx + 1) + ' / ' + st.lbItems.length;
  elLbNotice.textContent = '';
  elLbPrev.disabled = st.lbIdx === 0;
  elLbNext.disabled = st.lbIdx === st.lbItems.length - 1;

  if (st._lbSwapT) clearTimeout(st._lbSwapT);
  elLbImg.classList.remove('o-next','o-prev','i-next','i-prev','i-fade');

  const swap = () => {
    elLbImg.src = item.src;
    elLbImg.style.opacity = '1';
    elLbImg.classList.remove('o-next','o-prev');
    void elLbImg.offsetWidth; // reinicia a animação
    elLbImg.classList.add(dir === -1 ? 'i-prev' : dir === 1 ? 'i-next' : 'i-fade');
  };

  if (dir === 1 || dir === -1) {
    // fase 1: imagem atual desliza para fora no sentido da navegação
    void elLbImg.offsetWidth;
    elLbImg.classList.add(dir === 1 ? 'o-next' : 'o-prev');
    st._lbSwapT = setTimeout(swap, 150);   // fase 2: nova entra pelo lado oposto
  } else {
    elLbImg.style.opacity = '0';
    st._lbSwapT = setTimeout(swap, 110);
  }
}

function navLb(dir) {
  const ni = st.lbIdx + dir;
  if (ni < 0 || ni >= st.lbItems.length) return;
  st.lbIdx = ni;
  if (window._lbResetZoom) window._lbResetZoom();
  updateLb(dir);
}

function onLbKey(e) {
  if (e.key === 'Escape')      closeLb();
  if (e.key === 'ArrowLeft')   navLb(-1);
  if (e.key === 'ArrowRight')  navLb(1);
}

// ── 3DVista close communication ───────────────────────────────────
function closeGallery() {
  if (window.parent !== window) {
    window.parent.postMessage({ action: 'closeGallery' }, '*');
  }
}

// ── init ──────────────────────────────────────────────────────────
function init() {
  // Filtro inicial depende do modo
  if (MODE === 'plantas') {
    st.cat = DISPLAY_CATS[0].id;  // primeira tipologia de plantas
    st.sub = null;
  } else {
    st.cat = DISPLAY_CATS[0].id;               // 'areas-comuns'
    const c0 = getCat(st.cat);
    st.sub = (c0 && c0.subs && c0.subs.length) ? c0.subs[0].id : null;  // pré-seleciona 1ª sub
  }

  renderMainFilters();
  renderSubFilters();
  renderGallery();

  $('btn-close').addEventListener('click', closeGallery);
  $('lb-close').addEventListener('click', closeLb);
  elLbPrev.addEventListener('click', () => navLb(-1));
  elLbNext.addEventListener('click', () => navLb(1));
  $('lb-body').addEventListener('click', e => { if (e.target === $('lb-body')) closeLb(); });
}

// ── zoom + pan in lightbox ───────────────────────────────────────
(function () {
  const img      = document.getElementById('lb-img');
  const body     = document.getElementById('lb-body');
  const btnIn    = document.getElementById('lb-zoom-in');
  const btnOut   = document.getElementById('lb-zoom-out');
  const lblLevel = document.getElementById('lb-zoom-level');

  const MIN = 1, MAX = 5;
  let z = 1, px = 0, py = 0;
  let dragging = false, dragX = 0, dragY = 0, basePx = 0, basePy = 0;
  let pinchDist = null, touchX = 0, touchY = 0, touchPrevX = 0, touchPrevY = 0;

  // transform: translate(px, py) scale(z) com transform-origin: center
  // fórmula correta: px += (cursorX - imgCenterX) * (1 - nz/z)
  function applyTransform(smooth) {
    img.style.transition = smooth ? 'transform 0.18s ease-out' : 'none';
    img.style.transform  = (z === 1 && px === 0 && py === 0)
      ? '' : `translate(${px}px,${py}px) scale(${z})`;
    img.classList.toggle('zoomed', z > 1);
    lblLevel.textContent = Math.round(z * 100) + '%';
    btnOut.disabled = z <= MIN;
    btnIn.disabled  = z >= MAX;
  }

  function resetZoom() {
    z = 1; px = 0; py = 0;
    img.classList.remove('zoomed', 'dragging');
    applyTransform(true);
  }

  function zoomAt(dz, clientX, clientY, smooth) {
    const nz = Math.min(Math.max(z + dz, MIN), MAX);
    if (nz === z) return;
    const r = img.getBoundingClientRect();
    const cx = r.left + r.width  / 2;  // centro atual da imagem na tela
    const cy = r.top  + r.height / 2;
    // mantém o ponto sob o cursor fixo após a mudança de escala
    px += (clientX - cx) * (1 - nz / z);
    py += (clientY - cy) * (1 - nz / z);
    z = nz;
    applyTransform(!!smooth);
  }

  function bodyCenter() {
    const r = body.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // botões +/−: zoom em direção ao centro do viewport
  btnIn.addEventListener('click',  () => { const c = bodyCenter(); zoomAt(+0.5, c.x, c.y, true); });
  btnOut.addEventListener('click', () => { const c = bodyCenter(); zoomAt(-0.5, c.x, c.y, true); });

  // duplo clique: +2× no ponto clicado, ou reset
  img.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (z > 1) resetZoom(); else zoomAt(+2, e.clientX, e.clientY, true);
  });

  // roda do mouse: zoom suave no cursor
  let wheelRaf = null;
  body.addEventListener('wheel', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    e.preventDefault();
    const dz = e.deltaY < 0 ? 0.25 : -0.25;
    // cancelar transição durante scroll rápido para resposta imediata
    if (wheelRaf) cancelAnimationFrame(wheelRaf);
    wheelRaf = requestAnimationFrame(() => {
      zoomAt(dz, e.clientX, e.clientY, false);
      wheelRaf = null;
    });
  }, { passive: false });

  // arrasto com mouse (pan quando ampliado)
  img.addEventListener('mousedown', e => {
    if (z <= 1) return;
    e.preventDefault();
    dragging = true;
    dragX = e.clientX; dragY = e.clientY;
    basePx = px; basePy = py;
    img.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    px = basePx + (e.clientX - dragX);
    py = basePy + (e.clientY - dragY);
    applyTransform(false);
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    img.classList.remove('dragging');
  });

  // touch: swipe (z=1) ou pan (z>1) ou pinch zoom
  body.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    } else {
      pinchDist = null;
      touchX = touchPrevX = e.touches[0].clientX;
      touchY = touchPrevY = e.touches[0].clientY;
    }
  }, { passive: true });

  body.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchDist !== null) {
      e.preventDefault();
      const d  = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      zoomAt((d - pinchDist) * 0.018, cx, cy, false);
      pinchDist = d;
    } else if (e.touches.length === 1 && z > 1) {
      e.preventDefault();
      px += e.touches[0].clientX - touchPrevX;
      py += e.touches[0].clientY - touchPrevY;
      touchPrevX = e.touches[0].clientX;
      touchPrevY = e.touches[0].clientY;
      applyTransform(false);
    }
  }, { passive: false });

  body.addEventListener('touchend', e => {
    if (pinchDist !== null) { pinchDist = null; return; }
    if (z > 1) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 40 && Math.abs(dy) < 40) navLb(dx < 0 ? 1 : -1);
  }, { passive: true });

  window._lbResetZoom = resetZoom;
  applyTransform(false);
}());

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
